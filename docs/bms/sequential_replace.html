<h3>番号置換</h3>
<ul>
    <li>
        チェックした場合、新たにノートを配置するのではなく、<br>
        <b>選択中のノートの定義番号を指定された順番で置き換える</b>という動作になります。
    </li>
    <li>
        「開始位置」「レーン」「配置間隔」の設定は<b>全て無視</b>され、<br>
        指揮者レーン以外にある全ての選択中ノートに対して無差別に適用されます。
    </li>
    <li>
        シーケンスリストの要素数が足りない場合はループして適用されます。
    </li>
</ul>
